name: Deploy Student App URLs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/configure-pages@v6

      - name: Install root dependencies
        run: npm ci

      - name: Build three student apps
        run: node scripts/build-github-pages.mjs
        env:
          # Passed to vite build so VITE_ vars are baked into Pages bundle
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Baked into App1 bundle so the public Pages site (no local bridge)
          # can still call Gemini directly. SECURITY: the key MUST be HTTP-
          # referrer restricted in Google Cloud Console to the Pages origin
          # (https://timdirty.github.io/*) because anyone can read it from
          # browser view-source.
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          # On GitHub Pages there is no local bridge — disable proxy so app
          # starts cleanly in demo/offline mode without console errors
          VITE_AI_PROXY_DISABLED: '1'

      - name: Verify Pages artifact
        run: node scripts/pages-artifact-check.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
