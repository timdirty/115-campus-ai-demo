; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ---------------------------------------------------------------------------
; Firmware maintenance map
; ---------------------------------------------------------------------------
; App 1 whiteboard robot drive firmware:
;   env:  uno_r4_minima_app1_whiteboard_drive
;   file: src/app1_whiteboard_drive/main.cpp
;   use:  L293D Motor Shield v1, M3 + M4 dual-motor base
;
; App 2 sweeper robot drive firmware:
;   env:  uno_r4_wifi_app2_sweeper (R4 WiFi, CMSIS-DAP upload)
;         uno_r4_minima_app2_sweeper (R4 Minima, DFU upload)
;   file: src/app2_sweeper_drive/main.cpp
;   use:  L293D shield, M1+M2 wheels, M3+M4 sweeper rollers
;
; App 3 guardian sensor firmware:
;   env:  uno_r4_wifi_sensor
;   file: src/app3_guardian_sensor/main.cpp
;   use:  HY-M302 / DHT11 / photoresistor sensor node
;
; App 3 guardian four-wheel drive firmware:
;   env:  uno_r4_wifi_app3_guardian_drive (R4 WiFi, CMSIS-DAP upload)
;         uno_r4_minima_app3_guardian_drive (R4 Minima, DFU upload)
;   file: src/app3_guardian_drive/main.cpp
;   use:  L293D M1+M4 left side, M2+M3 right side
;
; Shared command demo firmware:
;   env:  uno_r4_wifi
;   file: src/main.cpp + src/commands.cpp
;   use:  shared serial command catalog for the three apps
;
; Full reference: docs/FIRMWARE_ENV_MAP.md
; ---------------------------------------------------------------------------

; Shared command demo firmware. Excludes per-team standalone firmware folders.
[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<app3_guardian_sensor/> -<app1_whiteboard_drive/> -<app3_guardian_drive/> -<app2_sweeper_drive/>
lib_deps =
    arduino-libraries/Servo@^1.3.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; App 3 國中 AI 校園心靈守護者 — four-wheel L293D drive base (R4 WiFi).
[env:uno_r4_wifi_app3_guardian_drive]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
build_src_filter = +<app3_guardian_drive/>
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; App 3 心靈守護者四輪底盤 — same source on UNO R4 Minima (DFU upload).
; Use when only the Minima board is on hand or for mixed-board stations.
[env:uno_r4_minima_app3_guardian_drive]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
monitor_speed = 115200
build_src_filter = +<app3_guardian_drive/>
upload_protocol = dfu
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; App 2 國小 校園服務機器人 — sweeper drive (M1+M2 wheels, M3+M4 rollers) on R4 WiFi.
[env:uno_r4_wifi_app2_sweeper]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
build_src_filter = +<app2_sweeper_drive/>

; App 2 sweeper drive — same source on UNO R4 Minima (DFU upload).
[env:uno_r4_minima_app2_sweeper]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
monitor_speed = 115200
build_src_filter = +<app2_sweeper_drive/>
upload_protocol = dfu
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true

; App 1 國小 AI 自動板擦機器人 — restored M3/M4 L293D dual-motor drive.
[env:uno_r4_minima_app1_whiteboard_drive]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
monitor_speed = 115200
build_src_filter = +<app1_whiteboard_drive/>
upload_protocol = dfu
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true

; App 3 sensor node on UNO R4 Minima — HY-M302 / DHT11 / light / RGB LED.
[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
monitor_speed = 115200
build_src_filter = +<app3_guardian_sensor/>
upload_protocol = dfu
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; HY-M302 sensor node on R4 WiFi board — same source as uno_r4_minima,
; uploads via CMSIS-DAP (no DFU / double-reset needed).
; Use when only the R4 WiFi is available or for mixed-board setups.
[env:uno_r4_wifi_sensor]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
build_src_filter = +<app3_guardian_sensor/>
upload_protocol = cmsis-dap
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
